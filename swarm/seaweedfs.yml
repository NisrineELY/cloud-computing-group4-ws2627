# SeaweedFS: 3 masters, 5 volume servers, filer + S3. Deploy: docker stack deploy -c seaweedfs.yml storage
version: "3.8"

x-weed: &weed
  image: chrislusf/seaweedfs:4.51
  networks: [drone-net]

x-deploy: &deploy
  endpoint_mode: dnsrr
  resources:
    limits:
      memory: 256M
  restart_policy:
    condition: any
    delay: 10s

x-masters: &masters seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333

services:
  seaweed-master1:
    <<: *weed
    command: master -ip=seaweed-master1 -ip.bind=0.0.0.0 -port=9333 -mdir=/data -peers=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -defaultReplication=001 -volumeSizeLimitMB=1024
    volumes: [master1_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node1]}

  seaweed-master2:
    <<: *weed
    command: master -ip=seaweed-master2 -ip.bind=0.0.0.0 -port=9333 -mdir=/data -peers=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -defaultReplication=001 -volumeSizeLimitMB=1024
    volumes: [master2_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node2]}

  seaweed-master3:
    <<: *weed
    command: master -ip=seaweed-master3 -ip.bind=0.0.0.0 -port=9333 -mdir=/data -peers=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -defaultReplication=001 -volumeSizeLimitMB=1024
    volumes: [master3_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node3]}

  seaweed-volume1:
    <<: *weed
    command: volume -ip=seaweed-volume1 -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0 -mserver=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -dataCenter=dc1 -rack=rack1
    volumes: [volume1_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node4]}

  seaweed-volume2:
    <<: *weed
    command: volume -ip=seaweed-volume2 -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0 -mserver=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -dataCenter=dc1 -rack=rack1
    volumes: [volume2_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node5]}

  seaweed-volume3:
    <<: *weed
    command: volume -ip=seaweed-volume3 -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0 -mserver=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -dataCenter=dc1 -rack=rack1
    volumes: [volume3_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node6]}

  seaweed-volume4:
    <<: *weed
    command: volume -ip=seaweed-volume4 -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0 -mserver=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -dataCenter=dc1 -rack=rack1
    volumes: [volume4_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node7]}

  seaweed-volume5:
    <<: *weed
    command: volume -ip=seaweed-volume5 -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0 -mserver=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -dataCenter=dc1 -rack=rack1
    volumes: [volume5_data:/data]
    deploy:
      <<: *deploy
      placement: {constraints: [node.hostname == node8]}

  seaweedfs:
    <<: *weed
    command: filer -ip=seaweedfs -ip.bind=0.0.0.0 -master=seaweed-master1:9333,seaweed-master2:9333,seaweed-master3:9333 -defaultStoreDir=/data -s3 -s3.port=8333 -s3.config=/run/secrets/seaweed_s3_config
    secrets: [seaweed_s3_config]
    volumes: [filer_data:/data]
    deploy:
      <<: *deploy
      resources:
        limits:
          memory: 384M
      placement: {constraints: [node.hostname == backendgroup4]}

volumes:
  master1_data:
  master2_data:
  master3_data:
  volume1_data:
  volume2_data:
  volume3_data:
  volume4_data:
  volume5_data:
  filer_data:

networks:
  drone-net:
    external: true

secrets:
  seaweed_s3_config:
    external: true