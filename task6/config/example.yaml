# task6 example configuration. Copy to config/local.yaml (git-ignored) and adapt.

serial:
  port: COM3            # Windows example; on the Pi e.g. /dev/ttyACM0
  baudrate: 115200

servos:
  pan:
    min_deg: 0
    max_deg: 180
    center_deg: 90
  tilt:
    min_deg: 0
    max_deg: 60           # safety limit: laser must never point upward
    center_deg: 30

laser:
  enabled_by_default: false

watchdog:
  timeout_ms: 1000        # no command within this time -> laser off, mount parks
